# .github/workflows/bump-version.yml
name: Bump Version on Main

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Security Scan
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  packages: read

jobs:
  bump-version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      !contains(github.event.workflow_run.head_commit.message, 'ci: Bump version'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Precisamos do token para poder fazer push de volta para o repositorio
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Configure Git User
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions-bot@github.com"

      - name: Bump patch version
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VERSION=$(./mvnw help:evaluate -Dexpression=revision -q -DforceStdout)
          BASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ] || [[ "$PATCH" =~ [^0-9] ]]; then
            echo "Unsupported revision: $CURRENT_VERSION"
            exit 1
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          ./mvnw -B versions:set-property \
            -Dproperty=revision \
            -DnewVersion="${NEW_VERSION}" \
            -DgenerateBackupPoms=false

          git commit -am "ci: Bump version to $NEW_VERSION"
          git push
