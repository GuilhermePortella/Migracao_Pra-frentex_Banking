# .github/workflows/bump-version.yml
name: Bump Version on Main

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    # Nao executa a action se o commit for do proprio bot para evitar loops
    if: "!contains(github.event.head_commit.message, 'ci: Bump version')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Precisamos do token para poder fazer push de volta para o repositorio
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Git User
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions-bot@github.com"

      - name: Bump patch version
        run: |
          # Incrementa a versao patch (0.0.X)
          mvn versions:increment-property -Dproperty=project.version -DallowSnapshots=true
          # Pega a nova versao para usar na mensagem de commit
          NEW_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          # Faz o commit da nova versao no pom.xml
          git commit -am "ci: Bump version to $NEW_VERSION"
          git push
