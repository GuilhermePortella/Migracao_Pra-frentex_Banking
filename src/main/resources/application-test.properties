# Disable default security for tests
spring.security.user.name=${DAST_BASIC_USER:teste}
spring.security.user.password=${DAST_BASIC_PASSWORD_ENCODED:${random.uuid}}
spring.security.enabled=false
management.endpoints.web.exposure.include=*
management.datadog.metrics.export.enabled=false
management.dynatrace.metrics.export.enabled=false

spring.datasource.url=jdbc:h2:mem:backing_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
